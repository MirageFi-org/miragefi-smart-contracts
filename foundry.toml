[profile.default]
src = "src"
out = "out"
libs = ["dependencies"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 100
via_ir = true

remappings = [
    "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.2.0/",
    "forge-std/=dependencies/forge-std-1.9.7/src/",
]

[dependencies]
forge-std = "1.9.7"
"@openzeppelin-contracts" = "5.2.0"

[soldeer]
remappings_generate = false
remappings_regenerate = false
